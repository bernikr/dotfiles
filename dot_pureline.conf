function box_segment {
  if [ -n "$container" ] || [ -f /run/.containerenv ] || [ -f /.dockerenv ]; then
    local bg_color=$1                  # Set the background color
    local fg_color=$2                  # Set the foregropund color
    local content="📦 $CONTAINER_ID"

    PS1+=$(segment_end $fg_color $bg_color)
    PS1+=$(segment_content $fg_color $bg_color " $content ")
    __last_color=$bg_color
  fi
}

# All segments are enabled. Uncomment/comment to enable/disable a segment
PL_SEGMENTS=(
    # segment                Background  Foreground
    # -------                ----------  ----------
    #'time_segment            LightGrey   Black'
    'battery_segment         Blue        Black'
    'box_segment             Yellow      Black'
    'ssh_segment             Yellow      Black'
    'user_segment            Green       Black'
    'path_segment            Blue        Black'
    'read_only_segment       Red         White'
    'virtual_env_segment     Green       Black'
    'git_segment             White       Black'
    'newline_segment'
    #'duration_segment        DarkGrey    White'
    'return_code_segment     Red         White'
    'background_jobs_segment Blue        Black'
